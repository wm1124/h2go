# H2-Go settings

# The MySQL server on this computer (the one phpMyAdmin shows).
#   XAMPP: user root, no password, port 3306 (already filled in below)
#   MAMP:  user root, password root, port 8889
# If you gave MySQL a password, type it after db.password=
db.host=localhost
db.port=3306
db.user=root
db.password=

# The web server. Open http://localhost:8080 after starting H2-Go.
# To open H2-Go on a phone on the same Wi-Fi, change server.host to 0.0.0.0
# and open the address H2-Go prints when it starts.
server.host=localhost
server.port=8080

# Online (one link for everyone) H2-Go doesn't use this file: see "Put H2-Go online" in README.md.
